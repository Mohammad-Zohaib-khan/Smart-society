# Local production-like stack (same images that are deployed to Azure).
#   cp .env.example .env   # then edit
#   docker compose up --build            -> http://localhost:8080
#   docker compose exec -e NODE_ENV=development api node dist/scripts/seed.js   # optional demo data
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"   # browsers accept Secure cookies on http://localhost
      MONGODB_URI: mongodb://mongo:27017/smartsociety
      WEB_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      TRUST_PROXY: "1"
    volumes: [uploads:/data/uploads]
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_UPSTREAM: http://api:4000
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  mongo-data:
  uploads:
